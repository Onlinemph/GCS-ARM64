name: Build and test gcsweb

on:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: web/go.sum

      # GCS's model layer imports the unison GUI toolkit for its theme types,
      # so the toolkit's cgo must compile even though nothing is drawn.
      - name: Install X11/GL development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxkbcommon-dev pkg-config

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -trimpath -o gcsweb .
