name: Build GCS for Windows ARM64

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'GCS release version (e.g. 5.44.0) or "latest"'
        required: false
        default: 'latest'
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/build-windows-arm64.yml'
      - 'scripts/**'

jobs:
  # Native build on GitHub's Windows 11 ARM64 runners, using upstream's own
  # build.sh + packager so the artifact matches an official release (icon,
  # version resources, file associations, zip layout).
  #
  # NOTE: windows-11-arm hosted runners are free for PUBLIC repos only. If
  # this repo is private, rely on the cross-zig job below instead.
  native:
    runs-on: windows-11-arm
    continue-on-error: true
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = '${{ github.event.inputs.version }}'
          if (-not $v -or $v -eq 'latest') {
            $meta = Invoke-RestMethod 'https://proxy.golang.org/github.com/richardwilkes/gcs/v5/@latest'
            $v = $meta.Version.TrimStart('v')
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Check out GCS source
        uses: actions/checkout@v4
        with:
          repository: richardwilkes/gcs
          ref: v${{ steps.ver.outputs.version }}

      - name: Check out this repo (for the setjmp shim)
        uses: actions/checkout@v4
        with:
          path: arm64-tools

      - name: Set up MSYS2 (CLANGARM64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          path-type: inherit
          install: >-
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-llvm
            zip
            unzip

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Build and package
        env:
          GCS_RELEASE: ${{ steps.ver.outputs.version }}
        run: |
          # The prebuilt libmupdf_windows_arm64.a imports _setjmpex, which
          # ARM64 Windows' ucrtbase.dll does not export. Link a self-contained
          # setjmp/longjmp implementation instead.
          clang -c -o setjmp_aarch64.o arm64-tools/scripts/setjmp_aarch64.S
          llvm-ar rcs libsetjmpshim.a setjmp_aarch64.o
          export CGO_LDFLAGS="-L$PWD -lsetjmpshim"
          # Patch unison for windows/arm64: WGL routing through opengl32.dll
          # and the cgo Skia binding (the syscall binding silently corrupts
          # float args on arm64). See scripts/patch-unison-arm64.sh.
          UNISON_DIR="$(go mod download -json github.com/richardwilkes/unison | sed -n 's/.*"Dir": "\(.*\)".*/\1/p')"
          cp -R "$UNISON_DIR" ../unison-patched && chmod -R u+w ../unison-patched
          arm64-tools/scripts/patch-unison-arm64.sh ../unison-patched llvm-dlltool
          go mod edit -replace "github.com/richardwilkes/unison=$(cd ..; pwd)/unison-patched"
          # build.sh only recognizes MINGW*/MSYS* as Windows; include CLANGARM64
          sed -i 's/MINGW\*|MSYS\*)/MINGW*|MSYS*|CLANG*)/' build.sh
          ./build.sh --dist
          # The cgo Skia binding needs the DLL next to gcs.exe, under its
          # internal export name.
          cp ../unison-patched/internal/skia/skia_windows_arm64.dll skia.dll
          zip -j gcs-*-windows-arm64.zip skia.dll

      - name: Verify ARM64 GUI executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter gcs.exe | Select-Object -First 1
          $b = [IO.File]::ReadAllBytes($exe.FullName)
          $pe = [BitConverter]::ToInt32($b, 0x3C)
          $machine = [BitConverter]::ToUInt16($b, $pe + 4)
          if ($machine -ne 0xAA64) { throw "Not ARM64 (machine=0x$($machine.ToString('x')))" }
          Write-Host "OK: native ARM64 executable at $($exe.FullName)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gcs-${{ steps.ver.outputs.version }}-windows-arm64-native
          path: gcs-*-windows-arm64.zip
          if-no-files-found: error

  # Cross-compiled build using Zig as the aarch64-windows C compiler. Runs on
  # plain ubuntu runners, so it works on private repos too. This is the same
  # path as scripts/build-windows-arm64.sh.
  cross-zig:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install zig
        run: python3 -m pip install ziglang

      - name: Build
        run: ./scripts/build-windows-arm64.sh "${{ github.event.inputs.version || 'latest' }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gcs-windows-arm64-cross
          path: build/gcs-*-windows-arm64.zip
          if-no-files-found: error
